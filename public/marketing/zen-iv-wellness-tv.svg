  <rect width="1920" height="1080" fill="url(#warmWash)"/>
  <rect x="28" y="28" width="1864" height="1024" rx="34" fill="none" stroke="#4b2e2a" stroke-width="6"/>
  <rect x="72" y="72" width="850" height="836" rx="38" fill="#4b2e2a"/>

