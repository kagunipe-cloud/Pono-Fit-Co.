<svg xmlns="http://www.w3.org/2000/svg" width="2550" height="3300" viewBox="0 0 2550 3300" role="img" aria-labelledby="title desc">
  <title id="title">Bachata Salsa Class with Jose Duran</title>
  <desc id="desc">A bold, easy-to-read flyer for weekly Friday salsa and bachata classes at Waialua Community Center.</desc>
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9253b"/>
      <stop offset="48%" stop-color="#ee4b4d"/>
      <stop offset="100%" stop-color="#167548"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#092b1b" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="2550" height="3300" fill="#fffaf2"/>
  <path d="M0 0H2550V670C2020 495 1605 880 1130 655C710 455 360 650 0 850Z" fill="url(#sunset)"/>
  <path d="M0 2800C580 2575 1020 2950 1510 2770C1960 2605 2260 2695 2550 2860V3300H0Z" fill="#0b4e31"/>

  <text x="1275" y="180" text-anchor="middle" fill="#0b4e31" font-family="Arial Black, Impact, sans-serif" font-size="76" font-weight="900" letter-spacing="5">
    BONITA LATIN DANCE
  </text>
  <rect x="965" y="245" width="620" height="125" rx="60" fill="#d9253b"/>
  <text x="1275" y="335" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Impact, sans-serif" font-size="92" font-weight="900" letter-spacing="4">
    NEW!
  </text>
  <text x="1275" y="650" text-anchor="middle" fill="#0b4e31" stroke="#ffd36d" stroke-width="18" paint-order="stroke fill" stroke-linejoin="round" font-family="Arial Black, Impact, sans-serif" font-size="285" font-weight="900" letter-spacing="-12">
    BACHATA
  </text>
  <text x="1275" y="930" text-anchor="middle" fill="#0b4e31" stroke="#ffd36d" stroke-width="18" paint-order="stroke fill" stroke-linejoin="round" font-family="Arial Black, Impact, sans-serif" font-size="235" font-weight="900" letter-spacing="-10">
    SALSA CLASS
  </text>

  <g filter="url(#shadow)">
    <rect x="135" y="1045" width="2280" height="365" rx="72" fill="#0b4e31"/>
    <text x="1275" y="1205" text-anchor="middle" fill="#ffd36d" font-family="Arial Black, Impact, sans-serif" font-size="138" font-weight="900">
      WITH JOSE DURAN
    </text>
    <text x="1275" y="1335" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Impact, sans-serif" font-size="82" font-weight="900" letter-spacing="1">
      EVERY FRIDAY · 6:30 PM
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="135" y="1540" width="2280" height="450" rx="70" fill="#ffffff" stroke="#0b4e31" stroke-width="18"/>
    <text x="1275" y="1705" text-anchor="middle" fill="#0b4e31" font-family="Arial Black, Impact, sans-serif" font-size="91" font-weight="900" letter-spacing="-1">
      WAIALUA COMMUNITY CENTER
    </text>
    <path d="M610 1810H1940" stroke="#d9253b" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="1275" cy="2310" r="295" fill="#ffd36d" stroke="#0b4e31" stroke-width="20"/>
    <text x="1275" y="2400" text-anchor="middle" fill="#0b4e31" font-family="Arial Black, Impact, sans-serif" font-size="260" font-weight="900">
