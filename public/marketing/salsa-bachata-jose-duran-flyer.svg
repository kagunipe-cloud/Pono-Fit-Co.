    </text>
  </g>

  <g>
    <rect x="135" y="2680" width="1100" height="205" rx="52" fill="#ffffff" stroke="#ffd36d" stroke-width="16"/>
    <text x="685" y="2818" text-anchor="middle" fill="#0b4e31" font-family="Arial Black, Impact, sans-serif" font-size="73" font-weight="900">
