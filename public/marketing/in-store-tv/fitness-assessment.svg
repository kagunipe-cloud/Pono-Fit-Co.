    <rect x="1120" y="170" width="560" height="720" rx="52" fill="#ffffff" opacity="0.08" stroke="#9ef6b2" stroke-opacity="0.35" stroke-width="3"/>
    <line x1="1240" y1="280" x2="1560" y2="280" stroke="#9ef6b2" stroke-width="10" stroke-linecap="round"/>
    <line x1="1240" y1="430" x2="1520" y2="430" stroke="#62b6ff" stroke-width="10" stroke-linecap="round"/>
    <line x1="1240" y1="580" x2="1600" y2="580" stroke="#9ef6b2" stroke-width="10" stroke-linecap="round"/>
    <circle cx="1168" cy="280" r="30" fill="#9ef6b2"/>
