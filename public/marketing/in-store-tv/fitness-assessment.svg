  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1680" cy="180" r="360" fill="#62b6ff" opacity="0.12"/>
  <circle cx="270" cy="930" r="420" fill="#9ef6b2" opacity="0.1"/>
  <rect x="78" y="74" width="1764" height="932" rx="58" fill="#ffffff" opacity="0.045" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <text x="150" y="156" fill="#9ef6b2" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" letter-spacing="8">PONO FIT CO.</text>
  <text x="150" y="310" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700">Fitness</text>
