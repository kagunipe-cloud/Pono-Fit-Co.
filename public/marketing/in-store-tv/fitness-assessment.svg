  <text x="156" y="506" fill="#dfe9ff" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic">Know your baseline. Train with purpose.</text>

  <rect x="150" y="578" width="612" height="96" rx="28" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="190" y="640" fill="#071018" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900">Book your movement screen</text>

