<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2550" height="3300" viewBox="0 0 2550 3300" role="img" aria-labelledby="title desc">
  <title id="title">Gym Bulletin — Bekah and Perry Away Until August 15</title>
  <desc id="desc">Bekah and Perry are visiting mainland ohana until August 15. Please put all weights away. Call or text 808-970-4969 with any issues.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#11100f" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="mintBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a2f4b1"/>
      <stop offset="100%" stop-color="#7dd994"/>
    </linearGradient>
  </defs>

  <!-- Mostly white background -->
  <rect width="2550" height="3300" fill="#ffffff"/>

  <!-- Brand double frame -->
  <rect x="90" y="90" width="2370" height="3120" rx="72" fill="none" stroke="#11100f" stroke-width="10"/>
  <rect x="140" y="140" width="2270" height="3020" rx="58" fill="none" stroke="#a2f4b1" stroke-width="12"/>

  <!-- Soft corner accents -->
  <circle cx="220" cy="220" r="48" fill="#a2f4b1" opacity="0.55"/>
  <circle cx="2330" cy="220" r="48" fill="#a2f4b1" opacity="0.55"/>
  <circle cx="220" cy="3080" r="48" fill="#a2f4b1" opacity="0.55"/>
  <circle cx="2330" cy="3080" r="48" fill="#a2f4b1" opacity="0.55"/>

  <!-- Compact brand header -->
  <image xlink:href="../Lei_Logo.png" x="875" y="170" width="800" height="380" preserveAspectRatio="xMidYMid meet"/>

  <!-- Main notice -->
  <g filter="url(#shadow)">
    <rect x="200" y="650" width="2150" height="850" rx="56" fill="#ffffff" stroke="#11100f" stroke-width="14"/>
    <text x="1275" y="875" text-anchor="middle" fill="#11100f" font-family="Arial Black, Impact, sans-serif" font-size="128" font-weight="900">
      BEKAH &amp; PERRY
    </text>
    <text x="1275" y="1015" text-anchor="middle" fill="#7e817e" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">
      are visiting
    </text>
    <text x="1275" y="1175" text-anchor="middle" fill="#11100f" font-family="Arial Black, Impact, sans-serif" font-size="112" font-weight="900" letter-spacing="-1">
      MAINLAND OHANA
    </text>
    <rect x="745" y="1260" width="1060" height="145" rx="72" fill="#a2f4b1"/>
    <text x="1275" y="1365" text-anchor="middle" fill="#11100f" font-family="Arial Black, Impact, sans-serif" font-size="88" font-weight="900">
      UNTIL 8/15
    </text>
  </g>

  <!-- Primary action: largest, shortest wording -->
  <g filter="url(#shadow)">
    <rect x="200" y="1580" width="2150" height="590" rx="56" fill="#f0fdf4" stroke="#11100f" stroke-width="14"/>
    <rect x="200" y="1580" width="2150" height="34" rx="17" fill="#a2f4b1"/>
    <text x="1275" y="1760" text-anchor="middle" fill="#11100f" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">
      Please take extra care of each other,
    </text>
    <text x="1275" y="1890" text-anchor="middle" fill="#11100f" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">
      and make sure to put all equipment back
    </text>
    <text x="1275" y="2020" text-anchor="middle" fill="#11100f" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">
      when you're pau.
    </text>
  </g>

  <!-- Contact -->
  <g filter="url(#shadow)">
    <rect x="200" y="2320" width="2150" height="470" rx="56" fill="#11100f"/>
    <text x="1275" y="2465" text-anchor="middle" fill="#a2f4b1" font-family="Arial Black, Impact, sans-serif" font-size="58" font-weight="900" letter-spacing="2">
      CALL OR TEXT WITH ANY ISSUES
    </text>
    <text x="1275" y="2650" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Impact, sans-serif" font-size="136" font-weight="900" letter-spacing="3">
      808-970-4969
    </text>
  </g>

  <!-- Small decorative dumbbell motif -->
  <g transform="translate(1275 2910)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#a2f4b1" stroke="#11100f" stroke-width="6"/>
    <rect x="-130" y="-42" width="52" height="84" rx="12" fill="#a2f4b1" stroke="#11100f" stroke-width="6"/>
    <rect x="78" y="-42" width="52" height="84" rx="12" fill="#a2f4b1" stroke="#11100f" stroke-width="6"/>
  </g>

  <text x="1275" y="3050" text-anchor="middle" fill="#11100f" font-family="Arial Black, Impact, sans-serif" font-size="48" font-weight="900" letter-spacing="2">
    MAHALO FOR HELPING KEEP THE GYM PONO!
  </text>
</svg>
