<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2550" height="3300" viewBox="0 0 2550 3300" role="img" aria-labelledby="title desc">
  <title id="title">Bekah and Perry Visiting Mainland Ohana</title>
  <desc id="desc">Gym notice: Bekah and Perry are visiting mainland ohana until August 15. Please put weights away. Contact 808-970-4969.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#11100f" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="mintBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a2f4b1"/>
      <stop offset="100%" stop-color="#7dd994"/>
    </linearGradient>
  </defs>

  <!-- Mostly white background -->
  <rect width="2550" height="3300" fill="#ffffff"/>

  <!-- Brand double frame -->
  <rect x="90" y="90" width="2370" height="3120" rx="72" fill="none" stroke="#11100f" stroke-width="10"/>
  <rect x="140" y="140" width="2270" height="3020" rx="58" fill="none" stroke="#a2f4b1" stroke-width="12"/>

  <!-- Soft corner accents -->
  <circle cx="220" cy="220" r="48" fill="#a2f4b1" opacity="0.55"/>
  <circle cx="2330" cy="220" r="48" fill="#a2f4b1" opacity="0.55"/>
  <circle cx="220" cy="3080" r="48" fill="#a2f4b1" opacity="0.55"/>
  <circle cx="2330" cy="3080" r="48" fill="#a2f4b1" opacity="0.55"/>

  <!-- Logo -->
  <image xlink:href="../Lei_Logo.png" x="675" y="175" width="900" height="450" preserveAspectRatio="xMidYMid meet"/>

  <text x="1275" y="720" text-anchor="middle" fill="#7e817e" font-family="Arial Black, Impact, sans-serif" font-size="62" font-weight="900" letter-spacing="6">
    PONO FIT CO.
  </text>

  <text x="1275" y="920" text-anchor="middle" fill="#11100f" font-family="Arial Black, Impact, sans-serif" font-size="118" font-weight="900" letter-spacing="-3">
    ALOHA OHANA
  </text>

  <rect x="475" y="980" width="1400" height="14" rx="7" fill="url(#mintBar)"/>

  <!-- Main notice -->
  <g filter="url(#shadow)">
    <rect x="200" y="1080" width="2150" height="520" rx="56" fill="#ffffff" stroke="#11100f" stroke-width="12"/>
    <text x="1275" y="1220" text-anchor="middle" fill="#11100f" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">
      Bekah and Perry are visiting
    </text>
    <text x="1275" y="1320" text-anchor="middle" fill="#11100f" font-family="Arial Black, Impact, sans-serif" font-size="96" font-weight="900" letter-spacing="-2">
      MAINLAND OHANA
    </text>
    <text x="1275" y="1420" text-anchor="middle" fill="#3d9d5f" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="900">
      until August 15
    </text>
  </g>

  <!-- Weights reminder -->
  <g filter="url(#shadow)">
    <rect x="200" y="1650" width="2150" height="380" rx="56" fill="#f0fdf4" stroke="#11100f" stroke-width="12"/>
    <rect x="200" y="1650" width="2150" height="28" rx="14" fill="#a2f4b1"/>
    <text x="1275" y="1810" text-anchor="middle" fill="#11100f" font-family="Arial Black, Impact, sans-serif" font-size="68" font-weight="900">
      Please be careful to put
    </text>
    <text x="1275" y="1910" text-anchor="middle" fill="#11100f" font-family="Arial Black, Impact, sans-serif" font-size="68" font-weight="900">
      weights away until then.
    </text>
  </g>

  <!-- Contact -->
  <g filter="url(#shadow)">
    <rect x="200" y="2100" width="2150" height="520" rx="56" fill="#11100f" stroke="#11100f" stroke-width="12"/>
    <text x="1275" y="2240" text-anchor="middle" fill="#a2f4b1" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">
      Call or text with any issues:
    </text>
    <text x="1275" y="2380" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Impact, sans-serif" font-size="120" font-weight="900" letter-spacing="2">
      808-970-4969
    </text>
    <text x="1275" y="2520" text-anchor="middle" fill="#a2f4b1" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">
      Mahalo for helping us keep the gym pono!
    </text>
  </g>

  <!-- Small decorative dumbbell motif -->
  <g transform="translate(1275 2780)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#a2f4b1" stroke="#11100f" stroke-width="6"/>
    <rect x="-130" y="-42" width="52" height="84" rx="12" fill="#a2f4b1" stroke="#11100f" stroke-width="6"/>
    <rect x="78" y="-42" width="52" height="84" rx="12" fill="#a2f4b1" stroke="#11100f" stroke-width="6"/>
  </g>

  <text x="1275" y="2960" text-anchor="middle" fill="#11100f" font-family="Arial Black, Impact, sans-serif" font-size="52" font-weight="900" letter-spacing="3">
    LIGHT HEARTS. HEAVY WEIGHTS.
  </text>
  <text x="1275" y="3040" text-anchor="middle" fill="#7e817e" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">
    @ponofitco - Haleiwa, HI
  </text>
</svg>
